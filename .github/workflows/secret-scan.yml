# Fails any push or pull request that adds a secret. Backstop for the local
# pre-commit hook (.githooks/pre-commit), which can be skipped with --no-verify.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a secret added and then deleted is still caught.
          fetch-depth: 0

      - name: Project secret check
        run: node scripts/check-secrets.mjs --all

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
